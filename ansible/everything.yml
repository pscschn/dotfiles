---

- name: Deploy everything
  hosts: all
  vars_files:
    - ./vars/fonts.yml
    - ./vars/colorscheme.yml
  vars:
    dotfile_tasks:
      - fonts.yml
      - hyprland.yml
      - alacritty.yml
      - waybar.yml
      - wofi.yml
      - mako.yml
      - nvim.yml
      - tmux.yml
      - firefox.yml
      - fastfetch.yml
  roles:
    - dotfiles
